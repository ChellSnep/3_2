<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Ćwiczenie 3_2</title>

    <style>
      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 800px;
      }
      th, td {
        border: 1px solid #ccc;
        padding: 10px 14px;
        text-align: left;
      }
      th {
        background-color: #f4f4f4;
      }
      .wrap {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>Stacje NOAA</h1>
    <div>
      <select id="endpoint" aria-label="Endpoint">
        <option value="stations">/stations</option>
        <option value="datasets">/datasets</option>
        <option value="datacategories">/datacategories</option>
        <option value="datatypes">/datatypes</option>
        <option value="locationcategories">/locationcategories</option>
        <option value="locations">/locations</option>
      </select>
      <input id="token" type="password" placeholder="Token API NOAA" autocomplete="off" aria-label="Token API NOAA">
      <button id="load">Pobierz stacje</button>
      <button id="more" class="secondary" disabled>Wczytaj kolejne 1000</button>
    </div>

    <div id="status" role="status"></div>

    <br>

    <div class="wrap">
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
      </div>


    <script src="script.js"></script>
  </body>
</html>
