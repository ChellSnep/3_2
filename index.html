<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Ćwiczenie 3_2</title>

    <style>
      form div {
        margin-bottom: 8px;
      }
      label {
        display: inline-block;
        min-width: 160px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 800px;
      }
      th, td {
        border: 1px solid #ccc;
        padding: 10px 14px;
        text-align: left;
      }
      th {
        background-color: #f4f4f4;
      }
      .wrap {
        overflow-x: auto;
      }
      #status.error {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <h1>Dane NOAA – /data</h1>

    <form id="form">
      <div>
        <label for="token">Token API</label>
        <input id="token" type="password" autocomplete="off" required>
      </div>
      <div>
        <label for="datasetid">datasetid</label>
        <input id="datasetid" value="GHCND" required>
      </div>
      <div>
        <label for="locationid">locationid</label>
        <input id="locationid" value="ZIP:28801">
      </div>
      <div>
        <label for="datatypeid">datatypeid</label>
        <input id="datatypeid">
      </div>
      <div>
        <label for="startdate">startdate</label>
        <input id="startdate" type="date" value="2010-05-01" required>
      </div>
      <div>
        <label for="enddate">enddate</label>
        <input id="enddate" type="date" value="2010-05-01" required>
      </div>
      <div>
        <label for="limit">limit</label>
        <input id="limit" type="number" min="1" max="1000" value="100">
      </div>
      <button type="submit" id="load">Pobierz dane</button>
    </form>

    <div id="status" role="status"></div>

    <br>

    <div class="wrap">
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <script src="script.js"></script>
  </body>
</html>
